    <!DOCTYPE html>
    <html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>Encuesta de satisfacción | Restaurante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
    --bosque:#0f3b2e; --bosque-oscuro:#08241c; --aji:#f4b400; --rocoto:#e4572e;
    --blanco:#ffffff; --suave:#eef4f0; --texto:#1b2a24; --gris:#66756d; --borde:#d9e3dd;
    --display:"Fraunces",Georgia,serif; --cuerpo:"DM Sans","Segoe UI",Arial,sans-serif;
    }
    html{min-height:100%}
    body{
    font-family:var(--cuerpo); color:var(--texto); line-height:1.5; min-height:100vh;
    background:
        radial-gradient(circle at 85% -10%, #f4b40040, transparent 45%),
        radial-gradient(circle at -10% 110%, #e4572e33, transparent 40%),
        var(--bosque);
    display:flex; flex-direction:column; align-items:center; padding:28px 16px 40px;
    }
    /* Cenefa escalonada, inspirada en el patrón andino */
    body::before{
    content:""; position:fixed; inset:0 0 auto 0; height:14px; z-index:5;
    background:
        linear-gradient(135deg,var(--aji) 25%,transparent 25%) -7px 0/14px 14px,
        linear-gradient(225deg,var(--aji) 25%,transparent 25%) -7px 0/14px 14px,
        linear-gradient(315deg,var(--rocoto) 25%,transparent 25%) 0 0/14px 14px,
        linear-gradient(45deg,var(--rocoto) 25%,transparent 25%) 0 0/14px 14px;
    background-color:var(--bosque-oscuro);
    }
    header{width:min(640px,100%); margin-top:18px; color:var(--blanco); text-align:left}
    .marca{display:flex; align-items:center; gap:12px; margin-bottom:14px}
    .logo{
    width:46px; height:46px; border-radius:14px; background:var(--aji); color:var(--bosque-oscuro);
    display:grid; place-items:center; font-size:22px; font-weight:700; transform:rotate(-6deg);
    box-shadow:3px 3px 0 var(--rocoto); overflow:hidden;
    }
    .logo img{width:100%; height:100%; object-fit:cover}
    .marca span{font-weight:500; color:#cfe0d6; font-size:14px}
    h1{font-family:var(--display); font-weight:800; font-size:clamp(32px,7vw,50px); line-height:1.05; letter-spacing:-.02em}
    h1 em{font-style:normal; color:var(--aji)}
    header p.sub{margin-top:10px; color:#cfe0d6; font-size:15px; max-width:46ch}

    /* Progreso */
    .progreso{width:min(640px,100%); margin:24px 0 14px}
    .progreso-info{display:flex; justify-content:space-between; color:#cfe0d6; font-size:13px; margin-bottom:8px}
    .pista{height:10px; background:#ffffff1f; border-radius:99px; overflow:hidden}
    .barra{height:100%; width:0; background:linear-gradient(90deg,var(--aji),var(--rocoto)); border-radius:99px; transition:width .5s cubic-bezier(.3,1.3,.5,1)}

    /* Tarjeta */
    .tarjeta{
    width:min(640px,100%); background:var(--blanco); border-radius:22px; padding:30px 28px 24px;
    box-shadow:0 22px 50px -18px #000a, 0 0 0 4px #ffffff14; position:relative; overflow:hidden;
    }
    .paso{animation:entra .38s cubic-bezier(.2,.9,.3,1)}
    .paso.atras{animation-name:entraAtras}
    @keyframes entra{from{opacity:0; transform:translateX(34px)}to{opacity:1; transform:none}}
    @keyframes entraAtras{from{opacity:0; transform:translateX(-34px)}to{opacity:1; transform:none}}
    .paso h2{font-family:var(--display); font-size:clamp(22px,4.6vw,28px); line-height:1.15; color:var(--bosque)}
    .paso .en{color:var(--gris); font-size:14px; margin:4px 0 20px}
    .paso .ayuda{font-size:13px; color:var(--rocoto); font-weight:500; margin:-12px 0 16px}

    .opciones{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
    .opciones.lista{grid-template-columns:1fr}
    .tile{position:relative; cursor:pointer}
    .tile input{position:absolute; opacity:0; inset:0; cursor:pointer}
    .tile .caja{
    display:flex; align-items:center; gap:12px; height:100%; padding:14px 16px;
    border:2px solid var(--borde); border-radius:14px; background:var(--blanco);
    transition:transform .18s, border-color .18s, background .18s, box-shadow .18s;
    }
    .opciones:not(.lista) .caja{flex-direction:column; text-align:center; padding:18px 10px; gap:6px}
    .ico{font-size:34px; line-height:1; transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
    .lista .ico{font-size:26px}
    .tile b{display:block; font-size:15px; font-weight:700; color:var(--texto)}
    .tile small{display:block; font-size:12px; color:var(--gris)}
    .tile:hover .caja{border-color:var(--aji); transform:translateY(-3px); box-shadow:0 8px 16px -8px #0003}
    .tile:hover .ico{transform:scale(1.2) rotate(-6deg)}
    .tile input:checked + .caja{border-color:var(--bosque); background:var(--suave); box-shadow:0 0 0 3px var(--aji)}
    .tile input:checked + .caja .ico{transform:scale(1.25)}
    .tile input:focus-visible + .caja{outline:3px solid var(--rocoto); outline-offset:2px}
    .tile.pop .caja{animation:pop .35s}
    @keyframes pop{40%{transform:scale(.94)}100%{transform:scale(1)}}
    /* Casilla de verificación visible para opciones múltiples */
    .multi .caja::after{
    content:"✓"; margin-left:auto; width:24px; height:24px; border-radius:7px; border:2px solid var(--borde);
    display:grid; place-items:center; color:transparent; font-size:14px; font-weight:700; flex-shrink:0; transition:.18s;
    }
    .multi input:checked + .caja::after{background:var(--bosque); border-color:var(--bosque); color:var(--aji)}

    textarea{
    width:100%; min-height:130px; resize:vertical; border:2px solid var(--borde); border-radius:14px;
    padding:14px; font:inherit; font-size:15px; outline:none; transition:.18s;
    }
    textarea:focus{border-color:var(--bosque); box-shadow:0 0 0 3px var(--aji)}
    .contador{text-align:right; font-size:12px; color:var(--gris); margin-top:6px}

    /* Navegación */
    .nav{display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:12px}
    button{font:inherit; cursor:pointer; border:none}
    .btn{padding:13px 26px; border-radius:99px; font-weight:700; font-size:15px; transition:.18s}
    .btn-principal{background:var(--bosque); color:var(--blanco); box-shadow:0 4px 0 var(--bosque-oscuro)}
    .btn-principal:hover:not(:disabled){transform:translateY(-2px); background:#14503e}
    .btn-principal:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--bosque-oscuro)}
    .btn-principal:disabled{background:#c5d0ca; box-shadow:none; cursor:not-allowed; color:#fff}
    .btn-final{background:var(--rocoto); box-shadow:0 4px 0 #a73a1c}
    .btn-final:hover:not(:disabled){background:#f0643a}
    .btn-atras{background:transparent; color:var(--gris); padding:13px 8px}
    .btn-atras:hover{color:var(--bosque)}
    .btn-atras[hidden]{visibility:hidden; display:block}
    button:focus-visible{outline:3px solid var(--rocoto); outline-offset:3px}

    /* Éxito */
    .exito{text-align:center; padding:18px 6px 6px; animation:entra .5s}
    .exito .gran{font-size:64px; display:inline-block; animation:salto 1s .2s both}
    @keyframes salto{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
    .exito h2{font-family:var(--display); font-size:32px; color:var(--bosque); margin:10px 0 6px}
    .exito p{color:var(--gris); max-width:38ch; margin:0 auto 20px}
    .pie{margin-top:22px; color:#9fb8ab; font-size:12px}
    canvas{position:fixed; inset:0; pointer-events:none; z-index:10}
    @media (max-width:480px){.tarjeta{padding:24px 18px 20px}.opciones{grid-template-columns:1fr 1fr}.opciones.lista{grid-template-columns:1fr}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
    </style>
    </head>
    <body>

    <header>
    <div class="marca">
        <div class="logo" id="logo">✦</div>
        <span>Tu opinión cuenta</span>
    </div>
    <h1>¿Qué tal tu <em>experiencia</em> con nosotros?</h1>
    <p class="sub">Cuéntanos cómo te atendimos, qué comiste y cómo te sentiste. Toma menos de dos minutos. <br>Tell us how we did.</p>
    </header>

    <div class="progreso" id="progreso">
    <div class="progreso-info"><span id="textoPaso">Pregunta 1</span><span id="porcentaje">0%</span></div>
    <div class="pista"><div class="barra" id="barra"></div></div>
    </div>

    <main class="tarjeta" id="tarjeta" aria-live="polite"></main>

    <p class="pie">© 2026 Encuesta de satisfacción</p>
    <canvas id="confeti"></canvas>


    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
    /* Si existe logo.png se muestra en lugar de la estrella */
    const imgLogo = new Image();
    imgLogo.onload = () => { const l = document.getElementById("logo"); l.textContent = ""; l.appendChild(imgLogo); };
    imgLogo.alt = ""; imgLogo.src = "logo.png";

    /* Cada opción: [valor, icono, texto en español, texto en inglés] */
    const PREGUNTAS = [
    { id:"momento", tipo:"uno", req:true,
        t:"¿Qué momento disfrutaste con nosotros?", en:"What brought you in today?",
        o:[["Desayuno","☕","Desayuno","Breakfast"],["Almuerzo","🍽️","Almuerzo","Lunch"],["Reservación","🎂","Reservación","Reservation"]] },
    { id:"atencion", tipo:"uno", req:true,
        t:"¿Cómo fue la atención del personal?", en:"How was the service?",
        o:[["Excelente","🤩","Excelente","Excellent"],["Buena","🙂","Buena","Good"],["Regular","😐","Regular","Fair"],["Mala","😖","Mala","Poor"]] },
    { id:"espera", tipo:"uno", req:true,
        t:"¿Qué tal el tiempo de espera?", en:"How was the wait for your food?",
        o:[["Muy rápido","⚡","Muy rápido",""],["Normal","⏱️","Normal",""],["Algo lento","🐢","Algo lento",""],["Demasiado lento","⌛","Demasiado lento",""]] },
    { id:"comida", tipo:"uno", req:true,
        t:"¿Qué tal estuvo la comida?", en:"How was the food?",
        o:[["Deliciosa","😋","Deliciosa","Delicious"],["Rica","🙂","Rica","Good"],["Regular","😐","Regular","Fair"],["No me gustó","😕","No me gustó","Disappointing"]] },
    { id:"detalles", tipo:"varios", req:true, lista:true,
        mostrar:r => r.comida === "Regular" || r.comida === "No me gustó",
        t:"¿Qué no te convenció?", en:"What fell short?", ayuda:"Marca todo lo que aplique.",
        o:[["Sabor","👅","Sabor",""],["Temperatura","🌡️","Temperatura del plato",""],["Porción","⚖️","Tamaño de la porción",""],["Presentación","🍽️","Presentación",""],["Producto no fresco","🥬","Frescura de los ingredientes",""]] },
    { id:"ambiente", tipo:"uno", req:true,
        t:"¿Cómo te pareció el ambiente?", en:"How was the atmosphere?",
        o:[["Encantador","🤩","Encantador","Lovely"],["Agradable","🙂","Agradable","Pleasant"],["Normal","😐","Normal","Average"],["Mejorable","😕","Mejorable","Could improve"]] },
    { id:"gusto", tipo:"varios", req:true,
        t:"¿Qué fue lo que más disfrutaste?", en:"What did you enjoy the most?", ayuda:"Puedes elegir varias.",
        o:[["Atención","🤝","Atención",""],["Sabor de la comida","😋","Sabor",""],["Ambiente","🏡","Ambiente",""],["Limpieza","✨","Limpieza",""],["Precio","💰","Precios",""],["Música y decoración","🎶","Música y decoración",""]] },
    { id:"precio", tipo:"uno", req:true, lista:true,
        t:"¿Qué te pareció la relación calidad-precio?", en:"How was the value for money?",
        o:[["Muy buena","💎","Excelente, vale cada sol",""],["Justa","👍","Justa para lo que recibí",""],["Algo cara","💸","Un poco cara para lo que recibí",""]] },
    { id:"recomienda", tipo:"uno", req:true,
        t:"¿Nos recomendarías a tus amigos y familia?", en:"Would you recommend us?",
        o:[["Seguro que sí","🙌","Seguro que sí","Definitely"],["Probablemente","🙂","Probablemente","Probably"],["No lo sé","🤔","No lo sé","Not sure"],["No","🙅","No","No"]] },
    { id:"satisfaccion", tipo:"uno", req:true,
        t:"En general, ¿qué tan satisfecho quedaste?", en:"Overall, how satisfied were you?",
        o:[["Muy satisfecho","😍","Muy satisfecho","Very satisfied"],["Satisfecho","🙂","Satisfecho","Satisfied"],["Neutral","😐","Neutral","Neither"],["Insatisfecho","🙁","Insatisfecho","Dissatisfied"],["Muy insatisfecho","😡","Muy insatisfecho","Very dissatisfied"]] },
    { id:"comentarios", tipo:"texto", req:false,
        t:"¿Algo más que quieras contarnos?", en:"Any suggestions or comments? (optional)" }
    ];

    const resp = {};
    let pos = 0;
    const tarjeta = document.getElementById("tarjeta");
    const barra = document.getElementById("barra");
    const activas = () => PREGUNTAS.filter(q => !q.mostrar || q.mostrar(resp));

    function ok(q){
    if(!q.req) return true;
    const v = resp[q.id];
    return Array.isArray(v) ? v.length > 0 : !!v;
    }

    function progreso(){
    const a = activas();
    const pct = Math.round(pos / a.length * 100);
    barra.style.width = pct + "%";
    document.getElementById("porcentaje").textContent = pct + "%";
    document.getElementById("textoPaso").textContent = `Pregunta ${pos + 1} de ${a.length}`;
    }

    function render(atras){
    const a = activas();
    const q = a[pos];
    const ultimo = pos === a.length - 1;
    let cuerpo = "";

    if(q.tipo === "texto"){
        cuerpo = `<textarea id="txt" maxlength="500" placeholder="Escribe aquí tu opinión…">${resp[q.id] || ""}</textarea>
                <div class="contador"><span id="cont">${(resp[q.id]||"").length}</span>/500</div>`;
    } else {
        const multi = q.tipo === "varios";
        cuerpo = `<div class="opciones ${q.lista ? "lista" : ""} ${multi ? "multi" : ""}">` +
        q.o.map(([v, ic, es, en], i) => {
            const marcado = multi ? (resp[q.id] || []).includes(v) : resp[q.id] === v;
            return `<label class="tile">
            <input type="${multi ? "checkbox" : "radio"}" name="${q.id}" value="${v}" ${marcado ? "checked" : ""}>
            <span class="caja"><span class="ico">${ic}</span><span><b>${es}</b>${en ? `<small>${en}</small>` : ""}</span></span>
            </label>`;
        }).join("") + `</div>`;
    }

    tarjeta.innerHTML = `
        <section class="paso ${atras ? "atras" : ""}">
        <h2>${q.t}</h2>
        <p class="en">${q.en}</p>
        ${q.ayuda ? `<p class="ayuda">${q.ayuda}</p>` : ""}
        ${cuerpo}
        <div class="nav">
            <button type="button" class="btn btn-atras" id="atras" ${pos === 0 ? "hidden" : ""}>← Atrás</button>
            <button type="button" class="btn btn-principal ${ultimo ? "btn-final" : ""}" id="sig" ${ok(q) ? "" : "disabled"}>
            ${ultimo ? "Enviar encuesta" : "Siguiente"}
            </button>
        </div>
        </section>`;
    progreso();

    const sig = document.getElementById("sig");
    sig.onclick = () => avanzar(q);
    document.getElementById("atras").onclick = () => { pos--; render(true); };

    if(q.tipo === "texto"){
        const t = document.getElementById("txt");
        t.oninput = () => { resp[q.id] = t.value; document.getElementById("cont").textContent = t.value.length; };
    } else {
        tarjeta.querySelectorAll("input").forEach(inp => {
        inp.onchange = () => {
            inp.closest(".tile").classList.add("pop");
            if(q.tipo === "varios"){
            resp[q.id] = [...tarjeta.querySelectorAll("input:checked")].map(i => i.value);
            } else {
            resp[q.id] = inp.value;
            // Si la comida deja de ser regular o mala, se limpia la pregunta de detalles
            if(q.id === "comida" && !["Regular","No me gustó"].includes(inp.value)) delete resp.detalles;
            }
            sig.disabled = !ok(q);
        };
        });
    }
    }

    function avanzar(q){
    if(!ok(q)) return;
    if(pos < activas().length - 1){ pos++; render(false); }
    else enviar();
    }


    async function enviar() {
    const boton = document.getElementById("sig");
    boton.disabled = true;
    boton.textContent = "Enviando...";

    // Convierte las respuestas del objeto en texto legible.
    const respuestasTexto = Object.entries(resp)
        .map(([pregunta, respuesta]) => {
            const valor = Array.isArray(respuesta)
                ? respuesta.join(", ")
                : respuesta;

            return `${pregunta}: ${valor}`;
        })
        .join("\n");

    // Datos que recibirá la plantilla del correo.
    const datosCorreo = {
        fecha: new Date().toLocaleString("es-PE"),
        satisfaccion: resp.satisfaccion || "No especificada",
        momento: resp.momento || "No especificado",
        atencion: resp.atencion || "No especificada",
        espera: resp.espera || "No especificada",
        comida: resp.comida || "No especificada",
        ambiente: resp.ambiente || "No especificado",
        comentarios: resp.comentarios || "No especificados",
        detalles: resp.detalles ? resp.detalles.join(", ") : "No especificados",
        gusto: resp.gusto ? resp.gusto.join(", ") : "No especificados",
        precio: resp.precio || "No especificado",
        recomienda: resp.recomienda || "No especificado",

        respuestas: respuestasTexto
    };

    try {
        // dentificadores de EmailJS.
        await emailjs.send(
            "service_ggey53o",
            "template_pd3np78",
            datosCorreo,
            {
                publicKey: "peogMEegUOGy19SY_"
            }
        );

        // Solo muestra éxito cuando EmailJS confirma el envío.
        barra.style.width = "100%";
        document.getElementById("porcentaje").textContent = "100%";
        document.getElementById("textoPaso").textContent = "¡Completado!";

        const bien = [
            "Muy satisfecho",
            "Satisfecho"
        ].includes(resp.satisfaccion);

        tarjeta.innerHTML = `
            <section class="exito">
                <div class="gran">${bien ? "🎉" : "🙏"}</div>

                <h2>¡Gracias por tu opinión!</h2>

                <p>
                    Tu respuesta fue enviada correctamente.
                    Agradecemos que nos ayudes a mejorar.
                </p>

                <button type="button"
                        class="btn btn-principal"
                        id="otra">
                    Responder otra vez
                </button>
            </section>
        `;

        document.getElementById("otra").onclick = () => {
            Object.keys(resp).forEach(k => delete resp[k]);
            pos = 0;
            render(false);
        };

        if (bien) confeti();

    } catch (error) {
        console.error("Error al enviar la encuesta:", error);

        alert(
            "No se pudo enviar la encuesta. " +
            "Verifica tu conexión e inténtalo nuevamente."
        );

        // Permite volver a intentar el envío.
        boton.disabled = false;
        boton.textContent = "Enviar encuesta";
    }
}


    /* Confeti sencillo */
    function confeti(){
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.getElementById("confeti"), x = c.getContext("2d");
    c.width = innerWidth; c.height = innerHeight;
    const col = ["#f4b400","#e4572e","#ffffff","#7fd1a8"];
    const ps = Array.from({length:110}, () => ({
        x:Math.random()*c.width, y:-20-Math.random()*c.height*.4, w:6+Math.random()*6, h:8+Math.random()*8,
        vx:-1.5+Math.random()*3, vy:2+Math.random()*3.5, r:Math.random()*6, vr:-.2+Math.random()*.4,
        c:col[Math.floor(Math.random()*col.length)]
    }));
    let f = 0;
    (function paso(){
        x.clearRect(0,0,c.width,c.height);
        ps.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();
        });
        if(++f < 220) requestAnimationFrame(paso); else x.clearRect(0,0,c.width,c.height);
    })();
    }

    render(false);
    </script>
    </body>
    </html>
